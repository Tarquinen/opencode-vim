name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and tests
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm ci

      - name: Cache Neovim reference binary
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/neovim
          key: neovim-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('test/helpers/neovim.ts') }}

      - name: Typecheck
        run: bun run typecheck

      - name: Check formatting
        run: bun run format:check

      - name: Test units and components
        run: bun run test

  e2e:
    name: E2E tests
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Install dependencies
        run: npm ci

      - name: Cache E2E binaries
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache/opencode
            node_modules/.cache/neovim
          key: e2e-binaries-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('test/e2e/support/opencode.ts', 'test/helpers/neovim.ts') }}-${{ github.sha }}
          restore-keys: |
            e2e-binaries-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('test/e2e/support/opencode.ts', 'test/helpers/neovim.ts') }}-

      - name: Test source and npm package in OpenCode
        env:
          E2E_WORKERS: "2"
        run: bun run test:e2e

      - name: Upload timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-timings
          path: test-results/e2e/*/result.json
          retention-days: 7

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: test-results/e2e/
          retention-days: 7
